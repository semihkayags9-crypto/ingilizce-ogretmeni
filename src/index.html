<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İngilizce Öğretmeni Aven</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f0f4f8;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #yukleniyor {
    text-align: center;
    color: #495057;
  }
  #yukleniyor .kalp {
    font-size: 42px;
    animation: nabiz 1.2s ease-in-out infinite;
  }
  #yukleniyor .metin {
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
  }
  @keyframes nabiz {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
  }
</style>
<script>
  // ============================================================
  // BOOTSTRAP - Ingilizce Ogretmeni Aven
  // Bu dosya APK icinde SABITTIR ve asla degismez.
  // Gorevi: cihazda guncel bir app.html var mi kontrol et,
  // varsa onu yukle, yoksa APK icindeki (gomulu) app.html'i goster.
  // ============================================================

  var GUNCELLEME_KLASOR = 'aven-updates';
  var DOSYA_ADI = 'app.html';

  async function calis() {
    var yukleniyor = document.getElementById('yukleniyor');
    try {
      // Capacitor native ortamda miyiz?
      var cap = window.Capacitor;
      var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();

      if (isNative) {
        // Native (Android) - Filesystem ile guncel app.html'i ara
        var FS = cap.Plugins && cap.Plugins.Filesystem;
        if (FS) {
          try {
            // Once guncel surum dosyasinin varligini kontrol et
            await FS.stat({ path: GUNCELLEME_KLASOR + '/' + DOSYA_ADI, directory: 'DATA' });
            // Dosya var -> WebView'da goruntulenebilir URL'ye cevir ve yonlen
            var uri = await FS.getUri({ path: GUNCELLEME_KLASOR + '/' + DOSYA_ADI, directory: 'DATA' });
            var webUrl = cap.convertFileSrc(uri.uri);
            window.location.href = webUrl;
            return; // yonlendirme basladi
          } catch (e) {
            // Dosya yok -> gomulu app.html'e dus (asagida)
          }
        }
      }

      // Native degil ya da guncel dosya yok -> gomulu app.html'i goster
      // Gomulu app.html, APK icinde ayni dizinde durur.
      window.location.href = 'app.html';
    } catch (err) {
      console.error('Bootstrap hatasi, gomulu app.html yukleniyor:', err);
      window.location.href = 'app.html';
    }
  }

  document.addEventListener('DOMContentLoaded', calis);
</script>
</head>
<body>
  <div id="yukleniyor">
    <div class="kalp">📚</div>
    <div class="metin">Yükleniyor...</div>
  </div>
</body>
</html>
