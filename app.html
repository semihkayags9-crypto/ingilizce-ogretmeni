<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İngilizce Öğretmeni Aven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Space Grotesk', 'Nunito', 'Segoe UI', Tahoma, sans-serif;
    background: #f4f7fb;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* Sol panel: seviye + ders modülleri */
  #lessonArea {
    flex: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #dbe3ee;
    background: #f4f7fb;
    overflow-y: auto;
  }
  #levelBar {
    padding: 14px 16px;
    background: #eef2f9;
    border-bottom: 1px solid #dbe3ee;
  }
  #levelBar h2 { margin: 0 0 10px; font-size: 17px; color: #23344b; }
  #levelSelect {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #b8c5d4;
    font-size: 15px;
    background: #fff;
  }
  #moduleBar {
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid #dbe3ee;
  }
  #moduleBar h3 { margin: 0 0 10px; font-size: 15px; color: #445; }
  #moduleGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .module-btn {
    padding: 12px 10px;
    border: 1px solid #ccd;
    border-radius: 10px;
    background: #f8fafd;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
    transition: all .15s;
  }
  .module-btn:hover { background: #e8f0ff; border-color: #3f6fd1; }
  .module-btn.active { background: #3f6fd1; color: #fff; border-color: #3f6fd1; }
  #lessonContent {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }
  #lessonTitle { margin: 0 0 6px; font-size: 18px; color: #23344b; }
  #lessonDesc { margin: 0 0 14px; color: #566579; font-size: 14px; line-height: 1.5; }
  #lessonBody { font-size: 15px; line-height: 1.6; color: #24344c; }
  .vocab-card {
    background: #fff;
    border: 1px solid #dbe3ee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .vocab-word { font-size: 18px; font-weight: 700; color: #1a4fbf; }
  .vocab-tr { color: #566579; font-size: 14px; margin-top: 2px; }
  .vocab-example { color: #1a7a3c; font-size: 14px; margin-top: 4px; font-style: italic; }
  .grammar-box {
    background: #fff;
    border-left: 4px solid #3f6fd1;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .grammar-rule { font-weight: 600; color: #23344b; margin-bottom: 4px; }
  .grammar-example { color: #1a7a3c; font-size: 14px; }
  .exercise-box {
    background: #fff8e6;
    border: 1px solid #f0d98a;
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
  }
  .exercise-box h4 { margin: 0 0 8px; color: #8a6d1a; }
  .exercise-input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd;
    border-radius: 8px;
    font-size: 15px;
    margin-top: 8px;
  }
  .exercise-btn {
    margin-top: 8px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #3f6fd1;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .exercise-feedback { margin-top: 8px; font-size: 14px; font-weight: 600; }
  .exercise-feedback.correct { color: #1a7a3c; }
  .exercise-feedback.wrong { color: #c0392b; }
  .speak-btn {
    margin-top: 8px;
    padding: 8px 14px;
    border: 1px solid #3f6fd1;
    border-radius: 8px;
    background: #fff;
    color: #3f6fd1;
    cursor: pointer;
    font-size: 13px;
  }
  .speak-btn:hover { background: #e8f0ff; }

  /* Sağ panel: sohbet */
  #chatPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fff;
    min-width: 320px;
  }
  #chatHeader {
    padding: 14px;
    background: #3f6fd1;
    color: white;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #apiKeyBtn, #voiceLangBtn {
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 7px;
    padding: 6px 9px;
    color: white;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
  }
  #showRobotBtn {
    display: none;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 7px;
    padding: 6px 9px;
    color: white;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
  }
  #showRobotBtn.visible { display: inline-block; }
  #teacherStage {
    position: relative;
    min-height: 240px;
    padding: 8px 34px 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #e9f1ff, #f8fbff);
    border-bottom: 1px solid #d7e3f4;
  }
  #teacherStage[hidden] { display: none; }
  #robotWrap {
    flex: 0 0 200px;
    height: 210px;
    border-radius: 18px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 24%, #ffffff, #c9dbf5 70%);
    box-shadow: 0 5px 14px rgba(44, 83, 135, .2);
  }
  #avenRobot { width: 100%; height: 100%; }
  #teacherStage.speaking #robotWrap { animation: avenTalk .65s ease-in-out infinite alternate; }
  @keyframes avenTalk { from { transform: translateY(0) scale(1); } to { transform: translateY(-4px) scale(1.025); } }
  #teacherBubble {
    position: relative;
    flex: 1;
    align-self: center;
    padding: 12px 14px;
    border-radius: 14px;
    color: #24344c;
    background: white;
    box-shadow: 0 3px 12px rgba(39, 72, 112, .12);
    line-height: 1.4;
    font-size: 14px;
  }
  #teacherBubble::before {
    content: '';
    position: absolute;
    left: -9px;
    top: 50%;
    width: 17px;
    height: 17px;
    background: white;
    transform: translateY(-50%) rotate(45deg);
  }
  #teacherName { display: block; color: #3f6fd1; font-weight: 700; margin-bottom: 4px; }
  #teacherSpeech { position: relative; margin: 0; }
  #hideRobotBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    border-radius: 50%;
    color: #52657e;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
  }
  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .msg.user { text-align: right; color: #1a4fbf; }
  .msg.ai { text-align: left; color: #1a7a3c; }
  #chatInputBar {
    display: flex;
    padding: 10px;
    gap: 8px;
    border-top: 1px solid #eee;
  }
  #chatInput {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  #chatInputBar button {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #3f6fd1;
    color: white;
    cursor: pointer;
    font-size: 15px;
  }
  #micBtn { background: #e0546a !important; }
  #micBtn.listening { background: #ff2244 !important; }
  #apiKeyDialog {
    border: none;
    border-radius: 12px;
    width: min(420px, calc(100vw - 36px));
    padding: 0;
    box-shadow: 0 12px 36px rgba(0,0,0,.28);
  }
  #apiKeyDialog::backdrop { background: rgba(19, 37, 61, .45); }
  .dialogContent { padding: 22px; }
  .dialogContent h2 { margin: 0 0 8px; font-size: 20px; color: #23344b; }
  .dialogContent p { color: #566579; line-height: 1.45; margin: 0 0 14px; }
  #apiKeyInput { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #b8c5d4; border-radius: 7px; font-size: 14px; }
  #apiKeyStatus { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: #b22d3a; }
  .dialogActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dialogActions button { border: none; border-radius: 7px; padding: 9px 13px; cursor: pointer; font-size: 14px; }
  #saveApiKeyBtn { background: #3f6fd1; color: white; }

  /* ===== MOBİL UYUM (telefon ekranı) ===== */
  #mobileTabs { display: none; }
  @media (max-width: 768px) {
    body {
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #mobileTabs {
      display: flex;
      flex: 0 0 auto;
      background: #2c3e50;
      border-bottom: 2px solid #1a2733;
      z-index: 100;
    }
    .tab-btn {
      flex: 1;
      padding: 13px 8px;
      border: none;
      background: transparent;
      color: #aab8c8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #fff;
      background: #34495e;
      border-bottom-color: #4fc3f7;
    }
    #lessonArea {
      flex: 1;
      border-right: none;
      border-bottom: 2px solid #dbe3ee;
      overflow-y: auto;
      display: none;
    }
    #lessonArea.tab-active { display: block; }
    #chatPanel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: none;
    }
    #chatPanel.tab-active { display: flex; }
    #levelBar { padding: 10px 12px; }
    #levelBar h2 { font-size: 15px; margin-bottom: 8px; }
    #moduleBar { padding: 10px 12px; }
    #moduleGrid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
    .module-btn { padding: 10px 8px; font-size: 13px; }
    #teacherStage { min-height: 150px; }
    #robotWrap { flex: 0 0 120px; height: 130px; }
    #chatHeader { flex-wrap: wrap; gap: 6px; }
    #chatHeader button { padding: 6px 8px; font-size: 12px; }
    #chatInputBar { padding: 8px; }
    #chatInput { font-size: 15px; }
    #micBtn { font-size: 13px; padding: 10px 12px; }
    .msg { font-size: 14px; }
    #lessonBody { font-size: 14px; }
    .exercise-box { padding: 10px; }
    .exercise-input { font-size: 14px; }
    #teacherBubble { font-size: 13px; }
    .dialog { width: min(92vw, 420px); }
  }
</style>
<script>window.APP_VERSION="07b3ebb-20260904";</script>
</head>
<body>

  <div id="mobileTabs">
    <button class="tab-btn active" data-tab="lessonArea" id="tabLessons">📚 Dersler</button>
    <button class="tab-btn" data-tab="chatPanel" id="tabChat">💬 Sohbet</button>
  </div>

  <div id="lessonArea" class="tab-active">
    <div id="levelBar">
      <h2>📚 İngilizce Seviyen</h2>
      <select id="levelSelect">
        <option value="A1" id="optA1">A1 — Başlangıç</option>
        <option value="A2" id="optA2">A2 — Temel</option>
        <option value="B1" id="optB1">B1 — Orta</option>
        <option value="B2" id="optB2">B2 — Orta-Üstü</option>
        <option value="C1" id="optC1">C1 — İleri</option>
      </select>
    </div>
    <div id="moduleBar">
      <h3 id="moduleBarTitle">📖 Ders Modülleri</h3>
      <div id="moduleGrid">
        <button class="module-btn active" data-module="vocab" id="modVocab">🔤 Kelime</button>
        <button class="module-btn" data-module="grammar" id="modGrammar">📐 Gramer</button>
        <button class="module-btn" data-module="sentences" id="modSentences">✍️ Cümle Kurma</button>
        <button class="module-btn" data-module="speaking" id="modSpeaking">🎤 Konuşma</button>
        <button class="module-btn" data-module="listening" id="modListening">👂 Dinleme</button>
      </div>
    </div>
    <div id="lessonContent">
      <h2 id="lessonTitle"></h2>
      <p id="lessonDesc"></p>
      <div id="lessonBody"></div>
    </div>
  </div>

  <div id="chatPanel">
    <div id="chatHeader"><span id="chatHeaderTitle">🧑‍🏫 İngilizce Öğretmeni Aven</span><span><button id="voiceLangBtn" type="button">🌐 TR</button><button id="showRobotBtn" type="button">🤖 Aven’i Göster</button><button id="apiKeyBtn" type="button">⚙ API Anahtarı</button><button id="voiceSetBtn" type="button">🔊 Ses</button></span></div>
    <section id="teacherStage" aria-label="Aven öğretmen">
      <button id="hideRobotBtn" type="button" title="Aven’i gizle" aria-label="Aven’i gizle">×</button>
      <div id="robotWrap"><model-viewer id="avenRobot" src="assets/aven-robot.glb" alt="Aven öğretmen robotu" camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer></div>
      <div id="teacherBubble"><span id="teacherName">Aven</span><p id="teacherSpeech">Merhaba! Ben Aven, İngilizce öğretmenin. Hangi seviyedesin?</p></div>
    </section>
    <div id="chatLog"></div>
    <div id="chatInputBar">
      <button id="micBtn" title="Aven ile sesli konuşmayı başlat">🎤 Konuş</button>
      <input id="chatInput" type="text" placeholder="İngilizce ya da Türkçe yaz..." />
      <button id="sendBtn">Gönder</button>
    </div>
  </div>

  <dialog id="apiKeyDialog" aria-labelledby="apiKeyTitle">
    <form class="dialogContent" id="apiKeyForm">
      <h2 id="apiKeyTitle">Groq API Anahtarı</h2>
      <p id="apiKeyDesc">Anahtar sadece bu bilgisayardaki <code>.env</code> dosyasına kaydedilir. Anahtarını kimseyle paylaşma.</p>
      <label for="apiKeyInput" id="apiKeyInputLabel">API anahtarı</label>
      <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_..." required />
      <div id="apiKeyStatus" role="status"></div>
      <div class="dialogActions">
        <button id="cancelApiKeyBtn" type="button">Vazgeç</button>
        <button id="saveApiKeyBtn" type="submit">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script>

        // Android/iOS: native TTS'i dogrudan toNative ile cagir (registerPlugin proxy'si native'e baglanmiyor gorunuyor)
        const capToNative = cap && cap.toNative;
        if (capToNative) {
          capToNative('TextToSpeech', 'speak', { text: text, lang: useLang, rate: rate, pitch: pitch }, function () {});
          return;
        }
      }
      // web/Electron: Web Speech API
      const doWebSpeak = () => {
        try {
          if (!window.speechSynthesis) return;
          const synth = window.speechSynthesis;
          synth.cancel();
          const parts = [];
          const re = /"([^"]*)"|'([^']*)'|“([^”]*)”/g;
          let last = 0, m;
          while ((m = re.exec(text)) !== null) {
            if (m.index > last) parts.push({ t: text.slice(last, m.index), lang: useLang });
            const q = m[1] ?? m[2] ?? m[3];
            if (q && q.trim()) parts.push({ t: q, lang: 'en-US' });
            last = re.lastIndex;
          }
          if (last < text.length) parts.push({ t: text.slice(last), lang: useLang });
          if (parts.length === 0) parts.push({ t: text, lang: useLang });
          for (const p of parts) {
            if (!p.t.trim()) continue;
            const u = new SpeechSynthesisUtterance(p.t);
            u.lang = p.lang; u.rate = rate; u.pitch = pitch;
            synth.speak(u);
          }
        } catch (e) { }
      };
      doWebSpeak();
    },
    async askAI(text, lang, contextNote, history) {
      const key = getKey();
      if (!key) return 'API anahtarı bulunamadı. Sağ üstteki ⚙ düğmesinden Groq API anahtarını gir.';
      const system = (lang === 'tr'
        ? 'Sen Aven, İngilizce öğreten sabırlı, samimi ve canlı bir öğretmensin. Öğrencinin SEVİYESİNE GÖRE (A1-A2 başlangıç, B1-B2 orta, C1 ileri) ders anlatırsın: çok basit cümlelerle başlayıp öğrenci hazır oldukça zorlaştırırsın. Her derste YENİ KELİMELER öğretirsin (kelime haznesi geniş olsun — günlük hayat, okul, aile, yemek, seyahat, iş, teknoloji, duygular, hava, spor vb. konulardan), her kelime için 2-3 gerçek örnek cümle verirsin, doğru telaffuzu gösterirsin. Öğrenciye AKTİF ALIŞTIRMA yaptırırsın: "Şimdi bu kelimeyle bir cümle kur", "Bu cümleyi İngilizce söyler misin?" gibi. Öğrencinin hatalarını nazikçe düzeltir, nedenini kısaca açıklarsın, sonra doğru halini örnekle pekiştirirsin. Bir konuyu öğrettikten sonra mutlaka KISA BİR TEKRAR/ÖZET yaparsın ve öğrenciye devam edip etmeyeceğini sorarsın. İngilizce kelime ve örnek cümleleri HER ZAMAN çift tırnak içinde ver: "apple", "Hello, how are you?" gibi. Türkçe açıklarken İngilizce örnekleri bol kullan. SADECE düz, akıcı ve samimi metinle konuş. Asla markdown (**, *, #, _, ```, listeler), token sayısı, API adı, model adı, kod parçası ya da teknik bilgi yazma. Kısa, net ve öğretici cümleler kur. Öğrenci bir kelimeyi/konuyu anlamadıysa sabırla farklı bir örnekle tekrar açıkla.'
        : 'You are Aven, a patient, warm and lively English teacher. Teach according to the student\'s LEVEL (A1-A2 beginner, B1-B2 intermediate, C1 advanced): start with very simple sentences and gently increase difficulty as the student is ready. In every lesson teach NEW WORDS (broad vocabulary — everyday life, school, family, food, travel, work, technology, emotions, weather, sports etc.), give 2-3 real example sentences for each word, and show correct pronunciation. Give ACTIVE PRACTICE: "Now make a sentence with this word", "Can you say this in English?". Correct mistakes kindly, briefly explain why, then reinforce with a correct example. After teaching a topic always give a SHORT RECAP/SUMMARY and ask the student if they want to continue. ALWAYS put English words and example sentences inside double quotes, like "apple", "Hello, how are you?". Use plenty of English examples while explaining. Speak ONLY in clean, fluent, plain text. Never use markdown (**, *, #, _, ```, lists), token counts, API names, model names, code snippets, or any technical info. Keep sentences short, clear and instructive. If the student doesn\'t understand, patiently re-explain with a different example.')
        + (contextNote ? '\n\n' + contextNote : '');
      const msgs = [{ role: 'system', content: system }];
      // Geçmiş mesajları ekle (bağlam kayması olmasın)
      if (Array.isArray(history)) {
        history.forEach(m => {
          if (m && m.role && m.content) msgs.push({ role: m.role, content: m.content });
        });
      }
      msgs.push({ role: 'user', content: text });
      const res = await fetch(GROQ_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: msgs,
          temperature: 0.7,
          max_tokens: 280
        })
      });
      if (!res.ok) throw new Error('Groq API hatası: ' + res.status);
      const data = await res.json();
      return data.choices && data.choices[0] ? data.choices[0].message.content : '';
    },
    async transcribeAudio(arrayBuffer, mimeType, language) {
      const key = getKey();
      if (!key) return '';
      const blob = new Blob([arrayBuffer], { type: mimeType || 'audio/webm' });
      const form = new FormData();
      form.append('model', 'whisper-large-v3-turbo');
      form.append('language', language || 'en');
      form.append('file', blob, 'recording.webm');
      const res = await fetch(GROQ_TRANSCRIBE_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key },
        body: form
      });
      if (!res.ok) throw new Error('Transkripsiyon hatası: ' + res.status);
      const data = await res.json();
      return data.text || '';
    },
    async getApiKeyStatus() {
      return { configured: Boolean(getKey()) };
    },
    async saveApiKey(key) {
      try { localStorage.setItem(KEY_STORE, key); return { ok: true }; }
      catch (e) { return { ok: false }; }
    }
  };
}

      const feedback = box.querySelector('.exercise-feedback');
      if (btn.dataset.answer) {
        const input = box.querySelector('.exercise-input');

        // noktalama, typographic apostrophe, fazla bosluk, buyuk/kucuk harf farklarini yok say.
        const norm = (s) => s

          .replace(/['’`]/g, "'")

// AI cevabindaki markdown/kalinti karakterleri temizle -> ari, dogal metin
function cleanAiText(raw) {
  if (!raw) return '';
  let t = String(raw);
  t = t.replace(/```[\s\S]*?```/g, ' ');       // kod bloklari
  t = t.replace(/`([^`]+)`/g, '$1');            // satir ici kod
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '$1');  // ***bold***
  t = t.replace(/\*\*([^*]+)\*\*/g, '$1');      // **bold**
  t = t.replace(/\*([^*]+)\*/g, '$1');          // *italic*
  t = t.replace(/__([^_]+)__/g, '$1');          // __text__
  t = t.replace(/_([^_]+)_/g, '$1');            // _text_
  t = t.replace(/^#{1,6}\s*/gm, '');            // baslik isaretleri
  t = t.replace(/^\s*[-*+]\s+/gm, '');          // liste madde isaretleri (basa)
  t = t.replace(/^\s*\d+[.)]\s+/gm, '');        // numarali liste
  t = t.replace(/[ \t]{2,}/g, ' ');            // fazla bosluk/tab (yeni satirlari KORU)
  t = t.replace(/[ \t]+$/gm, '');              // satir sonu bosluklar
  t = t.replace(/\n{3,}/g, '\n\n');            // fazla satir
  // Konusma icin: sembol/ozel karakterleri temizle (TTS bunlari okuyor)
  t = t.replace(/[*_#~|>]/g, ' ');             // * _ # ~ | >
  t = t.replace(/[\/\\]+/g, ' ');              // / ve \ (eğik çizgi)
  t = t.replace(/[→←↑↓•·]/g, ' ');             // ok/buton sembolleri
  t = t.replace(/\s{2,}/g, ' ');               // fazla bosluk
  return t.trim();
}

// Gerçek dosyaya yaz (Capacitor Filesystem - Android'de kalıcı) + localStorage yedeği
function saveMemory() {
  try {
    // Mesajlar + kaldığı ders birlikte tek objede sakla
    const payload = {
      messages: chatHistory.slice(-12),
      level: currentLevel,
      module: currentModule,

function loadMemory() {
  try {
    // Önce gerçek dosyadan okumayı dene (kalıcı depo), yoksa localStorage
    const FS = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    if (FS) {
      FS.readFile({ path: MEM_FILE, directory: 'DOCUMENTS', encoding: 'utf8' })

    } else {
      const h = localStorage.getItem(MEM_KEYS.history);
      if (h) hydrateMemory(h);
    }
  } catch (e) {
    try { const h = localStorage.getItem(MEM_KEYS.history); if (h) hydrateMemory(h); } catch (e2) {}

// Okunan JSON hafızayı arayüze geri yükle (önceki oturum son 4 mesajı ekranda görünür)
function hydrateMemory(data) {
  try {
    const obj = JSON.parse(data);
    // Eski format (düz dizi) ile yeni format (obje) uyumlu olsun
    const msgs = Array.isArray(obj) ? obj : (obj.messages || []);
    chatHistory = msgs;
    // Kaldığı son ders modülünü geri yükle (öncelik: dosyadaki context)
    let lastLvl = null, lastMod = null;
    if (!Array.isArray(obj)) { lastLvl = obj.level; lastMod = obj.module; }
    if (!lastLvl) lastLvl = localStorage.getItem('aven-last-level');
    if (!lastMod) lastMod = localStorage.getItem('aven-last-module');
    if (lastLvl && lastMod && LESSONS[lastLvl] && LESSONS[lastLvl][lastMod]) {
      currentLevel = lastLvl;
      currentModule = lastMod;
    }
    // Önceki oturumun son 4 mesajını ekranda göster (bağlam kayması olmasın)
    const last4 = chatHistory.slice(-4);
    if (last4.length && typeof chatLog !== 'undefined' && chatLog) {
      last4.forEach(m => {
        if (m && m.content) addMsg(m.content, m.role === 'assistant' ? 'ai' : 'user', false);
      });
    }
  } catch (e) {}
}

// Bir modül/değerlendirme etkileşimini kaydet
function trackInteraction(kind) {
  // Modül adını öğrenme stili anahtarına eşle (listen/speak/write/vocab/grammar)
  const map = { listening: 'listen', speaking: 'speak', sentences: 'write', vocab: 'vocab', grammar: 'grammar' };
  const key = map[kind] || kind;
  const s = loadStyleStats();
  s[key] = (s[key] || 0) + 1;
  // Son 40 etkileşim penceresi içinde oranlar anlamlı olsun
  const total = Object.values(s).reduce((a, b) => a + b, 0);
  saveStyleStats(s);
  return s;
}

// Kural tabanlı öğrenme stili analizi
function analyzeLearningStyle() {
  const s = loadStyleStats();
  const listen = s.listen || 0;       // Dinleme tıklaması (işitsel)
  const speak = s.speak || 0;        // Konuşma pratiği (kinestetik)
  const write = s.write || s.sentence || s.sentences || 0;  // Cümle kurma (okuma-yazma)
  const vocab = s.vocab || 0;        // Kelime kartı görüntüleme (görsel)
  const grammar = s.grammar || 0;    // Gramer kuralı (mantıksal/kurallı)
  const total = listen + speak + write + vocab + grammar;
  if (total < 3) return null; // yeterli veri yok

  const ratio = { listen, speak, write, vocab, grammar };
  const sorted = Object.entries(ratio).sort((a, b) => b[1] - a[1]);
  const primary = sorted[0][0];
  const secondary = sorted[1] ? sorted[1][0] : primary;

  const MAP = {
    listen:   voiceLanguage === 'en-US'
      ? { desc: 'Auditory (learns by hearing)', coach: 'Say words and sentences aloud, give listening exercises.', primary: 'listening', secondary: 'visual' }
      : { desc: 'İşitsel (duyarak öğrenir)',            coach: 'Kelimeleri ve cümleleri sesli söyle, dinleme egzersizleri ver.',             primary: 'dinleme',  secondary: 'görsel' },
    speak:    voiceLanguage === 'en-US'
      ? { desc: 'Kinesthetic (learns by doing)', coach: 'Have them practice speaking, build sentences, apply actively.', primary: 'speaking', secondary: 'listening' }
      : { desc: 'Kinestetik (yaparak öğrenir)',         coach: 'Konuşma pratiği yaptır, cümle kurmasını iste, aktif uygulat.',             primary: 'konuşma',  secondary: 'dinleme' },
    write:    voiceLanguage === 'en-US'
      ? { desc: 'Reading-writing (learns by writing)', coach: 'Have them write sentences, give fill-in-the-blank and translation exercises.', primary: 'writing', secondary: 'grammar' }
      : { desc: 'Okuma-yazma (yazarak öğrenir)',        coach: 'Cümleleri yazdır, boşluk doldurma ve çeviri egzersizleri ver.',            primary: 'yazma',    secondary: 'gramer' },
    vocab:    voiceLanguage === 'en-US'
      ? { desc: 'Visual (learns by seeing)', coach: 'Use flashcards, pictures and example sentences for visual presentation.', primary: 'visual', secondary: 'listening' }
      : { desc: 'Görsel (görerek öğrenir)',             coach: 'Kelime kartları, resim/örnek cümlelerle görsel sunum yap.',                primary: 'görsel',   secondary: 'dinleme' },
    grammar:  voiceLanguage === 'en-US'
      ? { desc: 'Logical (learns by rules)', coach: 'Explain grammar rules step by step, give structured examples.', primary: 'logical', secondary: 'writing' }
      : { desc: 'Mantıksal (kurallarla öğrenir)',       coach: 'Gramer kurallarını adım adım açıkla, yapılandırılmış örnekler ver.',       primary: 'mantıksal', secondary: 'yazma' },
  };
  const p = MAP[primary] || MAP.vocab;
  return { desc: p.desc, coach: p.coach, primary: p.primary, secondary: p.secondary };
}

function buildContextPrompt() {
  // Önceki oturumdan kalan bağlam ve son 4 mesajı AI'ya bağlam olarak ver
  let ctx = '';
  try {
    const lastCtx = JSON.parse(localStorage.getItem(MEM_KEYS.context) || '{}');
    if (lastCtx.level) {
      ctx += uiText('ctxResume') + lastCtx.level + uiText('ctxResume2') + lastCtx.module + '. ';
    }
  } catch (e) {}
  // Öğrenme stili profilini AI'ya tanıt (kişilik analizi → adaptif eğitim modeli)
  const style = analyzeLearningStyle();
  if (style) {
    ctx += uiText('ctxProfile') + style.desc + uiText('ctxProfile2') + style.coach + uiText('ctxProfile3') + style.primary + uiText('ctxProfile4') + style.secondary + uiText('ctxProfile5');
  }
  // Mevcut dersin içeriğini AI'ya ver → o derse özel "birebir" ders anlatsın
  try {
    const levelData = LESSONS[currentLevel];
    const lesson = levelData && levelData[currentModule];
    if (lesson && lesson.title) {
      ctx += `\nŞU ANKİ DERS: seviye ${currentLevel}, ${lesson.title}` + (lesson.desc ? ` (${lesson.desc})` : '') + '. ';
      if (Array.isArray(lesson.items) && lesson.items.length) {
        ctx += 'Bu dersteki kelimeler/örnekler: ';
        const wlist = lesson.items.slice(0, 25).map(it => it.word + ' = ' + (it.tr || '') + (it.example ? ' ("' + it.example + '")' : '')).join(', ');
        ctx += wlist + '. Bu dersteki kelimeleri öğret, örnek cümlelerle pekiştir, öğrenciyle bu kelimeler üzerinden pratik yap.\n';
      }
    }
  } catch (e) {}
  // chatHistory zaten last-8 içeriyor; son 4'ünü ayrıca bağlam olarak ekle
  if (chatHistory.length > 0) {
    const last4 = chatHistory.slice(-4).map(m => `${m.role}: ${m.content}`).join('\n');
    const contNote = voiceLanguage === 'en-US'
      ? '\nContinuing from previous conversation (keep context):\n'
      : '\nÖnceki konuşmadan devam (bağlam kayması olmasın):\n';
    ctx += contNote + last4 + '\n';
  }
  return ctx;
}

async function askAI(text) {
  addMsg(text, 'user');
  chatInput.value = '';
  const thinking = document.createElement('div');
  thinking.className = 'msg ai';
  thinking.textContent = '...';
  chatLog.appendChild(thinking);
  try {
    // Bağlam bilgisi + son mesaj geçmişi
    const contextNote = buildContextPrompt();
    const reply = await window.ogretmenAPI.askAI(text, voiceLanguage === 'en-US' ? 'en' : 'tr', contextNote, chatHistory.slice(-6));
    const cleanReply = cleanAiText(reply);

async function toggleListening() {
  const cap = window.Capacitor;
  const isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
  if (isNative) {
    // Android/iOS: native SpeechRecognition (getUserMedia WebView'da calismaz)
    if (isListening) { await _stopVoice(); return; }
    try {
      await _startNativeVoice();
    } catch (e) { alert(uiText('micPermissionMsg')); }
    return;
  }
  if (isListening) { await _stopVoice(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _startVoice(stream);
  } catch (e) { alert(uiText('micPermissionMsg')); }
}

let audioCtx = null;
let analyser = null;
let silentMs = 0;
let speaking = false;
let lastLevel = 0;
let voiceStream = null;
let nvPartialText = '';

function _startVoice(stream) {
  if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); }  // eski stream'i kapat
  voiceStream = stream;
  isListening = true;
  micBtn.textContent = uiText('micBtnStop');
  micBtn.classList.add('listening');
  audioChunks = [];
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
    }
    const src = audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
  } catch (e) {}
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const buf = await blob.arrayBuffer();
    const lang = voiceLanguage === 'en-US' ? 'en' : 'tr';
    try {
      const text = await window.ogretmenAPI.transcribeAudio(buf, 'audio/webm', lang);
      audioChunks = [];
      if (text && text.trim()) { chatInput.value = text.trim(); askAI(text.trim()); }
    } catch (e) { addMsg(uiText('transcribeFailed') + e.message, 'ai'); }
    // Konuşma modu açıksa otomatik yeniden dinlemeye başla (sürekli sohbet)
    if (isListening) {
      setTimeout(async () => {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          _startVoice(s);
        } catch (e) {}
      }, 500);
    }
  };
  mediaRecorder.start();
  // Ses seviyesini örnekle; 1.2 sn sessizlik olunca otomatik gönder
  const buf = new Uint8Array(analyser ? analyser.frequencyBinCount : 0);
  const checkTimer = setInterval(() => {
    if (!isListening) { clearInterval(checkTimer); return; }
    let level = 0;
    if (analyser) {
      analyser.getByteFrequencyData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i];
      level = sum / buf.length;
    }
    if (level > 18) { speaking = true; silentMs = 0; }
    else if (speaking) { silentMs += 120; if (silentMs >= 1200) {
      clearInterval(checkTimer);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    } }
    lastLevel = level;
  }, 120);
}

async function _stopVoice() {
  const cap = window.Capacitor;
  const isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
  if (isNative) {
    // native: speech-recognition'i durdur, varsa son metni AI'ya gonder
    try {
      const SR = cap.Plugins && cap.Plugins.SpeechRecognition;
      if (SR && SR.stop) { await SR.stop(); }
    } catch (e) {}
    // Final sonucun partialResults event'iyle donmesini bekle (onResults)
    // Gurultulu ortamda sonuc geç gelir; biraz daha bekle.
    await new Promise(r => setTimeout(r, 500));
    const done = (nvPartialText || '').trim();
    nvPartialText = '';
    isListening = false;
    micBtn.textContent = uiText('micBtnStart');
    micBtn.classList.remove('listening');
    // Sadece kisa/rahatsiz edici metni AI'ya gonderme; anlamli ise gonder
    if (done && done.length >= 2) { chatInput.value = done; askAI(done); }
    return;
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isListening = false;
  micBtn.textContent = uiText('micBtnStart');
  micBtn.classList.remove('listening');
  if (voiceStream) { voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
}

// Android/iOS: native SpeechRecognition ile konusmayi metne cevir
async function _startNativeVoice() {
  const cap = window.Capacitor;
  const SR = cap.Plugins && cap.Plugins.SpeechRecognition;
  if (!SR || !SR.start) throw new Error('SpeechRecognition yok');
  let perm = null;
  try { perm = await SR.checkPermissions(); } catch (e) {}
  const ok = perm && perm.speechRecognition === 'granted';
  if (!ok) { try { await SR.requestPermissions(); } catch (e) {} }
  isListening = true;
  micBtn.textContent = uiText('micBtnStop');
  micBtn.classList.add('listening');
  // Dil: Turkce modda tr-TR, Ingilizce modda en-US. ASR destekliyorsa kullan.
  const lang = voiceLanguage === 'en-US' ? 'en-US' : 'tr-TR';
  nvPartialText = '';
  // Canli kismi sonuclari goster + sakla; konusma bitince (stop) final AI'ya gider.
  const partialListener = (data) => {
    if (data && data.matches && data.matches.length) {
      const cand = data.matches[0] || '';
      // Gecikme/arka plan gurultusu: cok kisa ya da bos sonuc yoksay
      if (cand && cand.trim().length >= 2) {
        nvPartialText = cand.trim();
        if (chatInput) chatInput.value = nvPartialText;
      }
    }
  };
  try { await SR.addListener('partialResults', partialListener); } catch (e) {}
  await SR.start({ lang: lang, partialResults: true, maxResults: 3 });
}

});

// --- GARANTI TTS: Android'de ogretmenAPI.speak'in toNative ile native TTS'e gitmesini sagla. ---
// window.ogretmenAPI (Electron main.js/preload ya da baska bir script) zaten tanimli olabilir;
// o durumda renderer.js icindeki if(!window.ogretmenAPI) blogu atlanir ve eski doWebSpeak yuklu kalir.

(function () {
  var base = window.ogretmenAPI;
  var oldSpeak = base && base.speak;
  window.ogretmenAPI = window.ogretmenAPI || {};
  window.ogretmenAPI.speak = function (text, lang) {
    try {
      var cap = window.Capacitor;
      var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();
      if (isNative && cap.toNative) {
        var rate = parseFloat(localStorage.getItem('aven-rate')) || 1.05;
        var pitch = parseFloat(localStorage.getItem('aven-pitch')) || 1.0;
        var useLang = lang || 'en-US';
        cap.toNative('TextToSpeech', 'speak', { text: text, lang: useLang, rate: rate, pitch: pitch }, function () {});
        return;
      }
    } catch (e) {}
    if (oldSpeak) oldSpeak.call(this, text, lang);
  };
})();

  <script type="module">
// tts-plugin/index.js
// @capacitor/core'a bağımlılığı olmayan, doğrudan Web Speech API (speechSynthesis)
// kullanan basit bir TTS sarmalayıcı. Hem Android WebView'da hem tarayıcıda çalışır.
// Capacitor native TTS'e ihtiyaç yoktur çünkü speechSynthesis Android WebView'da desteklenir.

class TextToSpeech {
  constructor() {
    this.speechSynthesis = ('speechSynthesis' in window) ? window.speechSynthesis : null;
    this.supportedVoices = null;
    if (this.speechSynthesis) {
      // Bazı tarayıcılar sesleri asenkron yükler
      const load = () => { this.supportedVoices = this.speechSynthesis.getVoices(); };
      load();
      if (this.speechSynthesis.onvoiceschanged !== undefined) {
        this.speechSynthesis.onvoiceschanged = load;
      }
    }
  }

  isAvailable() {
    return !!this.speechSynthesis;
  }

  async speak(options) {
    if (!this.speechSynthesis) {
      throw new Error('SpeechSynthesis API not available in this browser.');
    }
    this.stop();
    const { text, lang, rate, pitch, volume } = options || {};
    const utterance = new SpeechSynthesisUtterance(text);
    if (lang) utterance.lang = lang;
    if (rate !== undefined) utterance.rate = Math.min(10, Math.max(0.1, rate));
    if (pitch !== undefined) utterance.pitch = Math.min(2, Math.max(0, pitch));
    if (volume !== undefined) utterance.volume = Math.min(1, Math.max(0, volume));
    // Dil için uygun sesi seçmeye çalış
    if (lang && this.supportedVoices && this.supportedVoices.length) {
      const match = this.supportedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase().split('-')[0]));
      if (match) utterance.voice = match;
    }
    return new Promise((resolve, reject) => {
      utterance.onend = () => resolve();
      utterance.onerror = (e) => reject(e);
      this.speechSynthesis.speak(utterance);
    });
  }

  stop() {
    if (this.speechSynthesis) {
      this.speechSynthesis.cancel();
    }
  }

  getSupportedLanguages() {
    const voices = this.speechSynthesis ? this.speechSynthesis.getVoices() : [];
    const languages = voices.map(v => v.lang).filter((v, i, a) => a.indexOf(v) === i);
    return { languages };
  }
}

// Global olarak erişilebilir yap (renderer.js window.Capacitor.Plugins.TextToSpeech arıyor)
const instance = new TextToSpeech();
if (window.Capacitor && window.Capacitor.Plugins) {
  window.Capacitor.Plugins.TextToSpeech = instance;
} else if (window.Capacitor) {
  window.Capacitor.Plugins = window.Capacitor.Plugins || {};
  window.Capacitor.Plugins.TextToSpeech = instance;
}
// Her durumda global erişim
window.TextToSpeech = instance;

export { TextToSpeech };
export default instance;

</script>
  <script>
// updater.js
// Ingilizce Ogretmeni Aven - OTA (Over-The-Air) guncelleme kontrolu.
// Uygulama acilista GitHub'dan en son surumu kontrol eder,
// fark varsa kullaniciya bildirim gosterir, onaylayinca yeni app.html'i
// cihaz depolamasina indirip yeniden baslatir.
//
// Barindirma: GitHub 'ota' branch'i -> raw.githubusercontent.com
// Mevcut surum: window.APP_VERSION (build script enjekte eder)

(function () {
  'use strict';

  // Kullanici semihkayags9-crypto reposu; ota branch'i guncellemeleri icerir.
  var REPO = 'semihkayags9-crypto/ingilizce-ogretmeni';
  var OTA_BRANCH = 'ota';
  var VERSION_URL = 'https://raw.githubusercontent.com/' + REPO + '/' + OTA_BRANCH + '/version.json';
  var APP_URL = 'https://raw.githubusercontent.com/' + REPO + '/' + OTA_BRANCH + '/app.html';

  var VERSION_KEY = 'aven-app-version';
  var UPDATES_DIR = 'aven-updates';
  var FILE_NAME = 'app.html';

  // Build script bu degeri enjekte eder (tarih + commit hash).
  var MEVCUT_SURUM = window.APP_VERSION || '0';

  function log(msg) { try { console.log('[updater]', msg); } catch (e) {} }

  async function fetchJson(url) {
    var res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function fetchText(url) {
    var res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }

  // Mevcut kullanici surumunu localStorage'dan oku; yoksa gomulu surumu kullan
  function getYerelSurum() {
    try {
      return localStorage.getItem(VERSION_KEY) || MEVCUT_SURUM;
    } catch (e) { return MEVCUT_SURUM; }
  }

  // Yeni app.html'i cihaz depolamasina yaz (DATA klasoru)
  async function yeniAppYiYaz(html) {
    var cap = window.Capacitor;
    var FS = cap && cap.Plugins && cap.Plugins.Filesystem;
    if (!FS) {
      // Web ortaminda test: localStorage'a da yaz (istatistik icin, gercek guncelleme degil)
      log('Native degil, guncelleme dosyasi yazilamadi (web modu)');
      return false;
    }
    // Klasoru olustur (varsa hata verir, yut)
    try { await FS.mkdir({ path: UPDATES_DIR, directory: 'DATA' }); } catch (e) {}
    await FS.writeFile({
      path: UPDATES_DIR + '/' + FILE_NAME,
      data: html,
      directory: 'DATA',
      encoding: 'utf8'
    });
    return true;
  }

  // Kullaniciya bildirim goster + onay al
  function bildirimGoster(yeniSurum) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;';
      var kutu = document.createElement('div');
      kutu.style.cssText = 'background:#fff;border-radius:16px;padding:24px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.3);';
      kutu.innerHTML =
        '<div style="font-size:40px;margin-bottom:8px;">🔄</div>' +
        '<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:6px;">Yeni güncelleme var!</div>' +
        '<div style="font-size:14px;color:#555;margin-bottom:16px;">İngilizce Öğretmeni Aven güncellenmiş sürümü yüklendi. Şimdi uygula?</div>' +
        '<div style="display:flex;gap:10px;justify-content:center;">' +
        '<button id="upd-simdi" style="flex:1;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;">Şimdi Güncelle</button>' +
        '<button id="upd-sonra" style="flex:1;padding:12px;background:#e9ecef;color:#333;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;">Sonra</button>' +
        '</div>';
      overlay.appendChild(kutu);
      document.body.appendChild(overlay);

      var simdi = kutu.querySelector('#upd-simdi');
      var sonra = kutu.querySelector('#upd-sonra');
      simdi.addEventListener('click', function () { overlay.remove(); resolve(true); });
      sonra.addEventListener('click', function () { overlay.remove(); resolve(false); });
    });
  }

  async function guncellemeyiKontrolEt() {
    try {
      // Sadece native ortamda calis (web testi icin engelleme yok, ama sessiz gec)
      var cap = window.Capacitor;
      var isNative = cap && cap.isNativePlatform && cap.isNativePlatform();

      var yerel = getYerelSurum();

      var uzak;
      try {
        uzak = await fetchJson(VERSION_URL);
      } catch (e) {
        log('Surum dosyasi alinamadi (internet yok olabilir):', e.message);
        return;
      }

      var yeniSurum = String(uzak.version || '0');
      if (yeniSurum === yerel) {
        log('Guncel surumdesin:', yeniSurum);
        return;
      }
      if (!isNative) {
        log('Native degil ama yeni surum var (gosterilmiyor):', yeniSurum);
        return;
      }

      log('Yeni surum bulundu:', yeniSurum, '(yerel:', yerel + ')');
      var onay = await bildirimGoster(yeniSurum);
      if (!onay) { log('Kullanici erteledi'); return; }

      // Yeni app.html'i indir
      var html = await fetchText(APP_URL);
      var yazildi = await yeniAppYiYaz(html);
      if (!yazildi) { log('Yazma basarisiz'); return; }

      // Surumu kaydet ve yeniden baslat
      try { localStorage.setItem(VERSION_KEY, yeniSurum); } catch (e) {}
      log('Guncelleme kuruldu:', yeniSurum);
      // Guncel app.html'i WebView'da yeniden yukle (dogrudan data yolundan)
      await appYiYenidenYukle();
    } catch (err) {
      log('Guncelleme kontrol hatasi:', err.message);
    }
  }

  // Indirilen yeni app.html'i WebView'da yukle (bootstrap'e donme, dogrudan hedefle)
  async function appYiYenidenYukle() {
    var cap = window.Capacitor;
    var FS = cap && cap.Plugins && cap.Plugins.Filesystem;
    if (!FS) { location.reload(); return; }
    try {
      var uri = await FS.getUri({ path: UPDATES_DIR + '/' + FILE_NAME, directory: 'DATA' });
      var webUrl = cap.convertFileSrc(uri.uri);
      window.location.href = webUrl;
    } catch (e) {
      log('Yeniden baslatma hatasi, reload:', e.message);
      location.reload();
    }
  }

  // Uygulama tamamen yuklendikten sonra calis
  function baslat() {
    // Uygulama arayuzunun olusmasini bekle (DOM + renderer.js basladiysa)
    var deneme = 0;
    var bekleyen = setInterval(function () {
      deneme++;
      // Arayuz hazir mi? (renderer.js'in UI icin bir element biraktigi kabul edilir)
      // Guvenli kontrol: bir kac saniye bekleyip calistir
      if (deneme >= 2) {
        clearInterval(bekleyen);
        guncellemeyiKontrolEt();
      }
    }, 1500);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    baslat();
  } else {
    document.addEventListener('DOMContentLoaded', baslat);
  }
})();

</script>
