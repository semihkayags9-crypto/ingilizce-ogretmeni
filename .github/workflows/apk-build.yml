name: APK Derleme

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Yerel deposunu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: npm bagimliliklarini kur
        run: npm install

      - name: Uygulamayi tek dosyada derle (app.html)
        run: node build-app.js

      - name: Capacitor web assetlerini senkronize et
        run: npx cap sync android

      - name: APK derle (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: APK dosyasini hazirla
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Aven-Ingilizce.apk

      - name: APK'yi GitHub Release'e yukle
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Aven-Ingilizce.apk

      - name: OTA branch'ine guncelleme yukle (her push'ta)
        run: |
          cp src/app.html ./ota-app.html
          COMMIT=$(git rev-parse --short HEAD)
          TARIH=$(date -u +%Y%m%d)
          echo "{\"version\":\"$COMMIT-$TARIH\",\"updatedAt\":\"$(date -u +%FT%TZ)\"}" > version.json
          echo "surum: $COMMIT-$TARIH"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ota
          git rm -rf . --quiet || true
          cp ota-app.html app.html
          git add app.html version.json
          git commit -m "OTA guncelleme: $COMMIT-$TARIH"
          git push -f origin ota
