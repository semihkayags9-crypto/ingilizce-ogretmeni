name: APK Derleme

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Yerel deposunu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: npm bagimliliklarini kur
        run: npm install

      - name: Capacitor web assetlerini senkronize et
        run: npx cap sync android

      - name: APK derle (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: APK dosyasini hazirla
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Aven-Ingilizce.apk

      - name: APK'yi GitHub Release'e yukle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Aven-Ingilizce.apk
